name: Deploy Backend to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to backend directory
            cd ~/neobuy-backend

            # Pull latest changes from prod branch
            git checkout prod
            git pull origin prod

            # Install packages (includes db-migrate for schema updates)
            npm install

            # Compile TypeScript
            npm run build

            # Apply pending database migrations
            npm run migrate:prod

            # Start or restart the service gracefully using PM2 (disabled for now)
            # pm2 restart dist/app.js --name "neobuy-backend" || pm2 start dist/app.js --name "neobuy-backend"
